name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXTENSION_CHROMIUM_DIST: apps/extension/dist-chromium
      EXTENSION_FIREFOX_DIST: apps/extension/dist-firefox
      # CI uses the bundled CPU runtime; avoid optional CUDA downloads.
      ONNXRUNTIME_NODE_INSTALL: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply isolated Phase 1 WIP and strict Region ID patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .ci/phase1-region-id-patch/chunk-00.b64 \
            .ci/phase1-region-id-patch/chunk-01.b64 \
            .ci/phase1-region-id-patch/chunk-02.b64 \
            .ci/phase1-region-id-patch/chunk-03.b64 \
            .ci/phase1-region-id-patch/chunk-04.b64 \
            .ci/phase1-region-id-patch/chunk-05.b64 \
            .ci/phase1-region-id-patch/chunk-06.b64 \
            .ci/phase1-region-id-patch/chunk-07.b64 \
            .ci/phase1-region-id-patch/chunk-08.b64 \
            .ci/phase1-region-id-patch/chunk-09.b64 \
            .ci/phase1-region-id-patch/chunk-10.b64 \
            | base64 -d > "$RUNNER_TEMP/phase1-region-id.patch.gz"
          echo "9200b525e67fe688aaf42591e748793bd5871999bb5dafcc3f7a49e18ea90a9e  $RUNNER_TEMP/phase1-region-id.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/phase1-region-id.patch.gz" > "$RUNNER_TEMP/phase1-region-id.patch"
          echo "8c9e30296004c22a92e67c5264b9d59ebc4f984553fc7bc4a5627fa54f6525b1  $RUNNER_TEMP/phase1-region-id.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/phase1-region-id.patch"
          git apply "$RUNNER_TEMP/phase1-region-id.patch"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/translators/llm.test.ts")
          source = path.read_text(encoding="utf-8")
          old = "import { LlmColumnsParseError, LlmRegionIdValidationError, llmTranslate, llmTranslateRegions }"
          new = "import { LlmRegionIdValidationError, llmTranslate, llmTranslateRegions }"
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one unused test import; refusing to modify an unexpected source.")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          echo "Applied strict Region ID patch to clean baseline."
          cat \
            .ci/phase1-region-id-popup-patch/chunk-00.b64 \
            .ci/phase1-region-id-popup-patch/chunk-01.b64 \
            .ci/phase1-region-id-popup-patch/chunk-02.b64 \
            .ci/phase1-region-id-popup-patch/chunk-03.b64 \
            | base64 -d > "$RUNNER_TEMP/phase1-popup.patch.xz"
          echo "9345d0b7fab20d6b536dda99549daf19b383de2c847706717ae4d1b35dc82854  $RUNNER_TEMP/phase1-popup.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/phase1-popup.patch.xz" > "$RUNNER_TEMP/phase1-popup.patch"
          echo "30248a0e952d23365f357a3bc696b6ea85822bc35e1f61e015d7472f52ef3af29  $RUNNER_TEMP/phase1-popup.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/phase1-popup.patch"
          git apply "$RUNNER_TEMP/phase1-popup.patch"
          git diff --check
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read pinned model release
        id: models
        run: echo "tag=$(jq -r .tag apps/extension/model-release.json)" >> "$GITHUB_OUTPUT"

      - name: Download and verify pinned models
        run: npm run models:download -- "${{ steps.models.outputs.tag }}"

      - name: Run quality gate
        run: npm run check

      - name: Install Playwright Chromium for Popup UI validation
        run: npx playwright install --with-deps chromium

      - name: Validate Ollama Popup UI on Chromium
        run: npm run check:popup-ui -- --browser=chromium

      - name: Audit Firefox lint warnings
        run: npm run lint:firefox --workspace=@shinobu/extension

      - name: Verify reproducible dual-target build
        run: npm run check:extension-reproducible

      - name: Upload dual-target smoke inputs
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            apps/extension/dist-chromium
            apps/extension/dist-firefox
          retention-days: 2

      - name: Check models.dev thinking capability drift
        run: npm run llm-thinking:check-drift

  chromium-smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: apps/extension
      - name: Install project Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium DNR and content-script smoke
        run: xvfb-run --auto-servernum npx tsx benchmark/perf/src/run-browser-image-download-smoke.ts

  firefox-smoke:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firefox: [latest-esr, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: ${{ matrix.firefox }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: apps/extension
      - name: Load Firefox extension
        run: xvfb-run --auto-servernum node scripts/smoke-firefox-load.mjs --dist apps/extension/dist-firefox --firefox "${{ steps.firefox.outputs.firefox-path }}"
      - name: Verify Firefox persistent-host lifecycle
        run: xvfb-run --auto-servernum node scripts/smoke-firefox-lifecycle.mjs --firefox "${{ steps.firefox.outputs.firefox-path }}" --idle-timeout-ms 1000
