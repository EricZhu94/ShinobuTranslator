name: Phase 1 Node 24 validation
on:
  push:
    branches:
      - ci/phase1-node24-validation-2026-11-05
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout clean 0.8.7 baseline plus validation harness
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - name: Reassemble and verify Phase 1 WIP patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase1-logs"
          node --version | tee "$RUNNER_TEMP/phase1-logs/node-version.log"
          npm --version | tee "$RUNNER_TEMP/phase1-logs/npm-version.log"
          node -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(1)'
          cat \
            .ci/phase1-patch/part-01.b64 \
            .ci/phase1-patch/part-02a.b64 \
            .ci/phase1-patch/part-02b.b64 \
            .ci/phase1-patch/part-03.b64 \
            .ci/phase1-patch/part-04.b64 | base64 -d > "$RUNNER_TEMP/phase1-review.patch.gz"
          echo "cc428084869777f5ab9b048405c22aab8e791f3fcd9d6d0259febbb9c4fa510a  $RUNNER_TEMP/phase1-review.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/phase1-review.patch.gz" > "$RUNNER_TEMP/phase1-review.patch"
          echo "7768d07fbe9f7db376be2253905bb79e469aa75e11c0bd25cc64631e1c3e8968  $RUNNER_TEMP/phase1-review.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/phase1-review.patch"
          git apply "$RUNNER_TEMP/phase1-review.patch"
          git diff --check
          echo "Patch applied to clean 0.8.7 baseline." | tee "$RUNNER_TEMP/phase1-logs/prepare.log"
          sha256sum package-lock.json | tee "$RUNNER_TEMP/phase1-logs/package-lock.sha256"
      - name: Fix timeout test rejection-handler timing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/translators/ollamaClient.test.ts")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          target = [
              "const pending = client.chatCompletions('http://127.0.0.1:11434/v1', requestBody);",
              "await vi.advanceTimersByTimeAsync(1_000);",
              "await expect(pending).rejects.toMatchObject({",
              "name: 'OllamaClientError',",
              "code: 'OLLAMA_TIMEOUT',",
              "retryable: true,",
              "});",
          ]
          matches = [
              i for i in range(len(lines) - len(target) + 1)
              if [line.strip() for line in lines[i:i + len(target)]] == target
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one timeout test block; found {len(matches)}. No file written.")

          index = matches[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          replacement = [
              "const pending = client.chatCompletions('http://127.0.0.1:11434/v1', requestBody);",
              "// Attach the rejection handler before advancing fake timers.",
              "const timeoutAssertion = expect(pending).rejects.toMatchObject({",
              "name: 'OllamaClientError',",
              "code: 'OLLAMA_TIMEOUT',",
              "retryable: true,",
              "});",
              "await vi.advanceTimersByTimeAsync(1_000);",
              "await timeoutAssertion;",
          ]
          lines[index:index + len(target)] = [indent + line + "\n" for line in replacement]
          path.write_text("".join(lines), encoding="utf-8")
          print("Updated timeout test block exactly once.")
          PY
          git diff --check
          grep -n -A12 -B2 "timeoutAssertion" tests/translators/ollamaClient.test.ts | tee "$RUNNER_TEMP/phase1-logs/timeout-test-fix.log"
      - name: Install exact locked dependencies with npm ci
        id: install
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/phase1-logs/npm-ci.log"
      - name: Read pinned model release
        id: models
        shell: bash
        run: echo "tag=$(jq -r .tag apps/extension/model-release.json)" >> "$GITHUB_OUTPUT"
      - name: Download and verify pinned models
        id: modeldownload
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run models:download -- "${{ steps.models.outputs.tag }}" 2>&1 | tee "$RUNNER_TEMP/phase1-logs/model-download.log"
      - name: Full workspace, test and benchmark typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/phase1-logs/typecheck.log"
      - name: Focused Phase 1 Vitest coverage
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx vitest run \
            tests/translators/ollamaClient.test.ts \
            tests/translators/llm.test.ts \
            tests/shared/config.test.ts \
            tests/shared/messages.test.ts \
            tests/shared/localPipelineProtocol.test.ts \
            tests/background/llmProxy.test.ts \
            tests/background/providerService.test.ts \
            tests/background/settingsStoreAtomicity.test.ts \
            tests/shared/diagnosticLog.test.ts \
            tests/shared/llmThinking.test.ts \
            tests/shared/webConfig.test.ts \
            tests/pipeline/translate.test.ts \
            2>&1 | tee "$RUNNER_TEMP/phase1-logs/focused-vitest.log"
      - name: Full Vitest suite
        id: fulltests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/phase1-logs/full-vitest.log"
      - name: Web regression tests
        id: webreg
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:web-regression 2>&1 | tee "$RUNNER_TEMP/phase1-logs/web-regression.log"
      - name: Architecture boundaries
        id: architecture
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:architecture 2>&1 | tee "$RUNNER_TEMP/phase1-logs/architecture.log"
      - name: Production license checks
        id: licenses
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:licenses 2>&1 | tee "$RUNNER_TEMP/phase1-logs/licenses.log"
      - name: Web production preflight
        id: webpreflight
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:web-production 2>&1 | tee "$RUNNER_TEMP/phase1-logs/web-preflight.log"
      - name: AMO metadata checks
        id: amo
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:amo-metadata 2>&1 | tee "$RUNNER_TEMP/phase1-logs/amo-metadata.log"
      - name: Build complete Chrome and Firefox extensions
        id: extbuild
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/phase1-logs/extension-build.log"
      - name: Audit Firefox lint warnings
        id: firefoxlint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint:firefox --workspace=@shinobu/extension 2>&1 | tee "$RUNNER_TEMP/phase1-logs/firefox-lint.log"
      - name: Verify reproducible dual-target build
        id: reproducible
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:extension-reproducible 2>&1 | tee "$RUNNER_TEMP/phase1-logs/reproducible-extension-build.log"
      - name: Build web application
        id: webbuild
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:web 2>&1 | tee "$RUNNER_TEMP/phase1-logs/web-build.log"
      - name: Publish validation summary
        if: always()
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          FULLTESTS: ${{ steps.fulltests.outcome }}
          WEBREG: ${{ steps.webreg.outcome }}
          ARCH: ${{ steps.architecture.outcome }}
          LICENSES: ${{ steps.licenses.outcome }}
          WEBPREFLIGHT: ${{ steps.webpreflight.outcome }}
          AMO: ${{ steps.amo.outcome }}
          EXTBUILD: ${{ steps.extbuild.outcome }}
          MODEL_DOWNLOAD: ${{ steps.modeldownload.outcome }}
          FIREFOXLINT: ${{ steps.firefoxlint.outcome }}
          REPRODUCIBLE: ${{ steps.reproducible.outcome }}
          WEBBUILD: ${{ steps.webbuild.outcome }}
        run: |
          {
            echo "## ShinobuTranslator Phase 1 — Node 24 validation"
            echo ""
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| npm ci | $INSTALL |"
            echo "| npm run typecheck | $TYPECHECK |"
            echo "| Focused Phase 1 Vitest | $FOCUSED |"
            echo "| Full Vitest suite | $FULLTESTS |"
            echo "| Web regression | $WEBREG |"
            echo "| Architecture | $ARCH |"
            echo "| Licenses | $LICENSES |"
            echo "| Web production preflight | $WEBPREFLIGHT |"
            echo "| AMO metadata | $AMO |"
            echo "| Pinned model download | $MODEL_DOWNLOAD |"
            echo "| Extension build | $EXTBUILD |"
            echo "| Firefox lint | $FIREFOXLINT |"
            echo "| Reproducible dual-target build | $REPRODUCIBLE |"
            echo "| Web build | $WEBBUILD |"
          } >> "$GITHUB_STEP_SUMMARY"
          for outcome in "$INSTALL" "$TYPECHECK" "$FOCUSED" "$FULLTESTS" "$WEBREG" "$ARCH" "$LICENSES" "$WEBPREFLIGHT" "$AMO" "$MODEL_DOWNLOAD" "$EXTBUILD" "$FIREFOXLINT" "$REPRODUCIBLE" "$WEBBUILD"; do
            [[ "$outcome" == "success" ]] || exit 1
          done
      - name: Upload all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinobu-phase1-node24-validation-logs
          path: ${{ runner.temp }}/phase1-logs/
          if-no-files-found: warn
          retention-days: 14
